services:
  chromadb:
    image: chromadb/chroma:latest
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports: ["8000:8000"]
    volumes: [chroma_data:/chroma/chroma]
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j_data:/data]
  redis:
    image: redis:7-alpine
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [postgres_data:/var/lib/postgresql/data]
  api:
    build: .
    command: uvicorn 03_metadata_enterprise_chatbot.api:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    volumes: [.:/app]
  web:
    build: .
    command: streamlit run 03_metadata_enterprise_chatbot/app.py --server.address 0.0.0.0
    environment: [RAG_API_URL=http://api:8000]
    ports: ["8501:8501"]
    volumes: [.:/app]
volumes:
  chroma_data:
  neo4j_data:
  postgres_data:
